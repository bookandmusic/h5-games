[package]
name = "yike"
version = "0.1.0"
description = "A mobile games app"
authors = ["you"]
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "yike"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = [] }
tauri-runtime = { version = "=2.10.1", default-features = false }
tauri-runtime-wry = { version = "=2.10.1", default-features = false }
tauri-utils = { version = "=2.8.3", default-features = false }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
