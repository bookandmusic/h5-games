<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCC00"/>
      <stop offset="100%" style="stop-color:#FF9500"/>
    </linearGradient>
    <linearGradient id="tileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD60A"/>
      <stop offset="100%" style="stop-color:#FFCC00"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="120" height="120" rx="24" fill="url(#bgGradient)"/>

  <!-- 4x4 网格暗示 -->
  <g opacity="0.3">
    <rect x="20" y="20" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="42" y="20" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="64" y="20" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="86" y="20" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="20" y="42" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="42" y="42" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="64" y="42" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="86" y="42" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="20" y="64" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="42" y="64" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="64" y="64" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="86" y="64" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="20" y="86" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="42" y="86" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="64" y="86" width="18" height="18" rx="4" fill="#fff"/>
    <rect x="86" y="86" width="18" height="18" rx="4" fill="#fff"/>
  </g>

  <!-- 主数字 2048 -->
  <text x="60" y="68"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32"
        font-weight="700"
        fill="#fff"
        text-anchor="middle"
        dominant-baseline="middle">
    2048
  </text>
</svg>